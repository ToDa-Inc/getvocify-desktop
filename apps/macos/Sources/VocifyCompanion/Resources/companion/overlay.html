<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vocify</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body {
        display: flex; align-items: center; justify-content: center;
        font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Geist", system-ui, sans-serif;
        color: #2b2620; -webkit-user-select: none; user-select: none;
      }
      .pill {
        display: flex; align-items: center; gap: 10px;
        width: calc(100% - 12px); box-sizing: border-box;
        padding: 8px 8px 8px 14px; border-radius: 999px;
        background: rgba(250, 248, 244, 0.96);
        border: 1px solid rgba(120, 100, 80, 0.16);
        box-shadow: 0 6px 24px rgba(40, 30, 20, 0.14);
        cursor: default;
      }
      .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #c2413b; animation: pulse 1.6s ease-in-out infinite; }
      .time { flex: none; font-variant-numeric: tabular-nums; color: #c2413b; font-weight: 500; }
      .line { flex: 1; min-width: 0; margin: 0; color: #6b6259; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      button {
        flex: none; border: 0; border-radius: 999px; padding: 6px 14px;
        background: #c2413b; color: #fff; font: inherit; font-weight: 500; cursor: pointer;
        transition: background 120ms ease, transform 120ms ease;
      }
      button:hover { background: #a8352f; }
      button:active { transform: scale(0.97); }
      @keyframes pulse { 50% { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <div class="pill" id="pill" title="Double-click to open Vocify">
      <span class="dot"></span>
      <span class="time" id="overlay-time">00:00</span>
      <p class="line" id="overlay-line">Listening…</p>
      <button id="overlay-stop" type="button">Stop</button>
    </div>
    <script>
      const shell = window.vocifyDesktop?.shell;
      const timeEl = document.getElementById('overlay-time');
      const lineEl = document.getElementById('overlay-line');
      shell?.onOverlayState((state) => {
        if (state?.elapsed) timeEl.textContent = state.elapsed;
        lineEl.textContent = state?.lastLine || 'Listening…';
      });
      document.getElementById('overlay-stop').addEventListener('click', (event) => {
        event.stopPropagation();
        shell?.command('stop');
      });
      document.getElementById('pill').addEventListener('dblclick', () => shell?.command('show'));
    </script>
  </body>
</html>
