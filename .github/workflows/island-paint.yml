name: Island paint check

# Looks for stale paint in the island's see-through window on Windows (test/paint-island.mjs). Never publishes anything.
# How to use it and what it can and cannot show: docs/WINDOWS-PAINT-CHECK.md
on:
  workflow_dispatch:
  push:
    branches: ["paint/**"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node island/build.mjs --preview
      - name: A call with long turns
        run: npx electron test/paint-island.mjs --report
      - name: Quick back-and-forth
        run: npx electron test/paint-island.mjs --script=rally --report
      - name: The same call with hardware acceleration off
        run: npx electron test/paint-island.mjs --nogpu --report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: island-paint
          path: app/test/out-paint/*.png
          if-no-files-found: ignore
