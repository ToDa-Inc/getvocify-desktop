name: Desktop app

# One workflow for the Electron app on Windows and Mac. Both are built from the same commit with the same version,
# tested, and then published together as ONE GitHub pre-release. Installed apps read `latest.yml` (Windows) or
# `latest-mac.yml` (Mac) from the newest release, so both files must be in the same release.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/desktop-app.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the result as a release that installed apps update to"
        type: boolean
        default: false

# Publishing a release needs write access to this repository's contents.
permissions:
  contents: write

# One release at a time, so two pushes cannot race to publish. A test run of a branch that does not publish waits in its
# own queue: sharing the release queue, a branch run replaced a release waiting its turn (GitHub keeps one pending run).
concurrency:
  group: ${{ (github.event_name == 'push' || inputs.publish) && 'desktop-release' || format('desktop-test-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --no-audit --no-fund

      # Every build gets a higher version than the last, which is how installed apps know there is something newer.
      # The commit count only grows on main, and Windows and Mac get the same number.
      - name: Version this build
        shell: bash
        run: npm version "0.4.$(git rev-list --count HEAD)" --no-git-tag-version

      - run: npm run build
      # The native helper, built with the C# compiler Windows already has; the installer ships it, the checks below run it.
      - name: Build the Windows helper
        run: npm run build:win-helper
      - run: npm run typecheck

      # What can be checked without a screen: the ported logic, the shell's modules, call detection, the controller.
      - name: Logic tests
        run: npm run test:logic

      # What the app costs an idle Windows PC: per process, and the programs it launches each minute. Measured, not gating.
      - name: Idle cost (per process, programs launched per minute)
        run: npm run test:idle

      # The same with the island as a side pill, whose window covers the screen: only when asked for (not on a release).
      - name: Idle cost with the side pill
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:idle
        env:
          VOCIFY_IDLE_PLACEMENT: side

      # What only Windows can answer: the real microphone-use record and a real browser's address bar.
      - name: Windows mechanisms (registry, address bar)
        run: npm run test:windows

      # Real windows on the Windows runner: the island's layout, the call-audio pipeline, a whole call through the shell.
      - name: Island checks in real windows
        run: npm run test:island
      # Windows' own mouse on the pill: a press and a drag move it to another edge, it stays there, a click opens it.
      - name: Pill placement with real mouse input
        if: always()
        run: npm run test:side
      # Several calls in a row, each with real clicks: the island answers at once and the main process does not stall.
      - name: Several calls in a row stay responsive
        if: always()
        run: npm run test:calls
      # What a rep notices first: a real mouse click on the island must act at once and must not take focus from the call.
      - name: Real click on the island does not take focus
        run: npm run test:focus
      # The island never takes the keyboard, so a selection in it could never be copied: a real drag selects nothing.
      - name: Real drag over the transcript selects nothing
        run: npm run test:select
      # The whole flow with Windows' own mouse and keyboard: every island interaction, typing in the card, and the call
      # window keeping focus throughout.
      - name: Whole flow with real input
        run: npm run test:real
      - name: Keep the island screenshots from the Windows run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-screenshots-windows
          path: |
            app/test/out/*.png
            app/test/out-real/*.png
          if-no-files-found: ignore
      - name: Call-audio pipeline
        run: npm run test:loopback
      - name: A whole call through the shell
        run: npm run test:shell
      # The rep's mic can cancel everything the PC plays (Zoom, a video): Chromium's echoCancellation "all".
      - name: The microphone can apply echoCancellation "all"
        run: npm run test:echo-all

      - name: Build the installer
        run: npm run dist:win

      - name: Install it and start it once
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\Vocify-Setup-*.exe | Select-Object -First 1
          "installer: $($setup.Name), $([math]::Round($setup.Length / 1MB, 1)) MB"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Vocify\Vocify.exe'
          # The installer can hand over to a copy of itself and come back before the files are in place (this step failed
          # at random with "not installed"): wait until no installer is left running and the app is there.
          for ($i = 0; $i -lt 120 -and ((Get-Process -Name 'Vocify-Setup*' -ErrorAction SilentlyContinue) -or -not (Test-Path $exe)); $i++) { Start-Sleep -Seconds 1 }
          "waited $i s for the installer to finish"
          Start-Sleep -Seconds 3
          Get-Process -Name Vocify -ErrorAction SilentlyContinue | Stop-Process -Force   # the installer starts the app; start it ourselves below
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          # The native helper is installed with the app and runs from there.
          $helper = Join-Path (Split-Path $exe) 'resources\win-helper\vocify-win-helper.exe'
          if (-not (Test-Path $helper)) { throw "the native helper is not installed at $helper" }
          $said = & $helper version | Out-String
          if ($said -notmatch 'vocify-win-helper') { throw "the installed helper did not answer: $said" }
          "the installed helper answers: $($said.Trim())"
          $installed = (Get-ChildItem (Split-Path $exe) -Recurse | Measure-Object Length -Sum).Sum
          "installed size: $([math]::Round($installed / 1MB, 1)) MB"
          $p = Start-Process -FilePath $exe -ArgumentList '--demo', '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test exit code $($p.ExitCode)" }
          "the installed app started, showed its island and quit cleanly"

      # The installer plus the file installed apps read to learn there is a newer version.
      - uses: actions/upload-artifact@v4
        with:
          name: Vocify-Windows
          path: |
            app/release/Vocify-Setup-*.exe
            app/release/Vocify-Setup-*.exe.blockmap
            app/release/latest.yml
          if-no-files-found: error

  mac:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Version this build
        run: npm version "0.4.$(git rev-list --count HEAD)" --no-git-tag-version

      - run: npm run build
      - run: npm run typecheck

      - name: Logic tests
        run: npm run test:logic

      # The rep's mic can cancel everything the Mac plays (Zoom, a video): Chromium's echoCancellation "all".
      - name: The microphone can apply echoCancellation "all"
        run: npm run test:echo-all

      # The native macOS helper (call audio, call detection, notch).
      - name: Build native helper
        run: |
          # Without the helper the Mac app has no call audio and no call detection: never ship that.
          bash native/mac-helper/build.sh
          test -x native/mac-helper/dist/vocify-mac-helper
          # The island's non-activating window (a click must never bring the dashboard forward).
          bash native/mac-panel/build.sh
          test -f native/mac-panel/dist/mac_panel.node

      # Installed Macs update only to an app signed with the same certificate as the one they run. Two ways to sign:
      # - developer-id: the five Apple secrets. Notarized: opens with a double-click.
      # - vocify-dev: the team's own "Vocify Dev" certificate (VOCIFY_DEV_CERT_BASE64 + VOCIFY_DEV_CERT_PASSWORD).
      #   macOS asks "Open Anyway" once on first install; updates install by themselves (tried 2026-11-09).
      # Neither: the build is for hand-testing only and is not published.
      - name: How is this build signed?
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          DEV_CERT: ${{ secrets.VOCIFY_DEV_CERT_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.VOCIFY_DEV_CERT_PASSWORD }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$DEV_CERT" ] && [ -n "$DEV_CERT_PASSWORD" ]; then
            echo "mode=vocify-dev" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Mac signing secrets: this Mac build is for hand-testing and will not be published."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash ../scripts/import-apple-cert.sh

      # The runner cannot be made to trust a self-signed certificate (macOS refuses the trust change without a
      # person). It does not need to: codesign signs with it by SHA-1 once its keychain is on the search list, which
      # import-apple-cert.sh does, and build/sign-vocify-dev.cjs hands electron-builder that SHA-1.
      - name: Import the Vocify Dev certificate
        if: steps.signing.outputs.mode == 'vocify-dev'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.VOCIFY_DEV_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.VOCIFY_DEV_CERT_PASSWORD }}
        run: |
          bash ../scripts/import-apple-cert.sh
          security find-identity -p codesigning "$RUNNER_TEMP/vocify-signing.keychain-db" | grep -q 70D4242A077672091CF69A7C118A8671C0995D8F

      # Developer ID: signed with the imported identity (CSC_* are set by import-apple-cert.sh) and notarized.
      # No secrets: whatever electron-builder finds (nothing on a runner), for hand-testing.
      - name: Build the app
        if: steps.signing.outputs.mode != 'vocify-dev'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      # Vocify Dev: no hardened runtime (with a self-signed certificate macOS kills a hardened app at launch) and no
      # notarization, the same build as `dist:mac:local`.
      - name: Build the app (Vocify Dev)
        if: steps.signing.outputs.mode == 'vocify-dev'
        run: npm run dist:mac:self-signed

      - name: Verify code signature
        if: steps.signing.outputs.signed == 'true'
        run: codesign --verify --deep --strict release/mac-universal/Vocify.app

      # Installed apps compare the update's certificate with their own: a different "Vocify Dev" (a new one, or a
      # teammate's) would be downloaded and then refused on every Mac. Fail here instead.
      - name: Signed with the team's Vocify Dev certificate
        if: steps.signing.outputs.mode == 'vocify-dev'
        run: |
          codesign -d -r- release/mac-universal/Vocify.app 2>&1 | tee /dev/stderr \
            | grep -q 'certificate leaf = H"70d4242a077672091cf69a7c118a8671c0995d8f"'

      - name: Helper is inside the app
        run: |
          test -x release/mac-universal/Vocify.app/Contents/Resources/mac-helper/vocify-mac-helper
          test -f release/mac-universal/Vocify.app/Contents/Resources/mac-panel/mac_panel.node

      # The dmg and zip, plus the file installed apps read to learn there is a newer version.
      - uses: actions/upload-artifact@v4
        with:
          name: Vocify-macOS
          path: |
            app/release/Vocify-*.dmg
            app/release/Vocify-*.dmg.blockmap
            app/release/Vocify-*.zip
            app/release/Vocify-*.zip.blockmap
            app/release/latest-mac.yml
          if-no-files-found: error

  # Only when both systems built, passed their tests and started: one release holding both systems' files.
  publish:
    needs: [windows, mac]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Vocify-Windows
          path: release

      - uses: actions/download-artifact@v4
        if: needs.mac.outputs.signed == 'true'
        with:
          name: Vocify-macOS
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(sed -n 's/^version: //p' release/latest.yml)"
          test -n "$version"
          if [ "${{ needs.mac.outputs.signed }}" = "true" ]; then
            test "$(sed -n 's/^version: //p' release/latest-mac.yml)" = "$version"
          else
            echo "::warning::No signed Mac build (no Mac signing secrets): release v$version has Windows files only; installed Mac apps get no update."
          fi
          ls -l release
          # Pre-release: the app's updater is set to read pre-releases (app/main/src/updater.ts).
          gh release create "v$version" --prerelease --title "$version" --target "$GITHUB_SHA" \
            --notes "Built from $GITHUB_SHA" release/*
