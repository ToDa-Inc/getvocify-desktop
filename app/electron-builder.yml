appId: com.vocify.app
productName: Vocify
electronVersion: 33.4.11
directories:
  output: release
  buildResources: build
# Everything the app needs at run time is bundled by esbuild into these folders; no node_modules ship.
files:
  - package.json
  - main/dist/**
  - "!main/dist/**/*.map"
  - main/demo/**
  - main/assets/**
  - island/dist/index.html
  - island/dist/island.js
  - island/dist/island.css
  - island/dist/icon.png
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # No signing yet: Windows shows its "unknown publisher" screen on first run (More info, then Run anyway).
  signAndEditExecutable: true
nsis:
  # A per-user install in %LOCALAPPDATA%: no administrator rights, no prompt.
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Vocify-Setup-${version}.${ext}
mac:
  target:
    - dmg
    - zip
  # One app for Apple Silicon and Intel (dist:mac passes --universal); the native pieces are already universal, so the merge keeps them as they are.
  x64ArchFiles: "Contents/Resources/{mac-helper/vocify-mac-helper,mac-panel/mac_panel.node}"
  icon: build/icon.png
  # Required for notarization and App Store compliance (Electron docs: Required Features).
  # https://www.electron.build/configuration/mac#required-features
  hardenedRuntime: true
  entitlements: build/entitlements.plist
  entitlementsInherit: build/entitlements-inherit.plist
  # Helper binary ships outside asar, signed and hardened.
  extraResources:
    - from: native/mac-helper/dist/vocify-mac-helper
      to: mac-helper/vocify-mac-helper
    - from: native/mac-panel/dist/mac_panel.node
      to: mac-panel/mac_panel.node
  # Minimum macOS version for App Transport Security and hardened runtime.
  minimumSystemVersion: "14.2"
  # Signing identity from env (CSC_NAME, CSC_KEY_PASSWORD, CSC_LINK); skipped if absent (unsigned/ad-hoc build).
  # Notarization driven by APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID; skipped if absent.
  # https://www.electron.build/configuration/mac#notarize
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: Vocify records your microphone while you are on the call.
    NSAudioCaptureUsageDescription: Vocify listens to the call audio through your system.
    NSAppleEventsUsageDescription: Vocify reads your CRM window to see who you are talking to.
# Builds are published as GitHub pre-releases by the Windows workflow; installed apps check them (see main/src/updater.ts).
publish:
  provider: github
  owner: ToDa-Inc
  repo: getvocify-desktop
  releaseType: prerelease
