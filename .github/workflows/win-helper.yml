name: Windows helper check

# The native Windows helper alone: built and run against the real Windows of the runner (a real browser's address bar,
# Core Audio's sessions, the registry). A few minutes, so the helper can be worked on without the whole desktop run.
on:
  workflow_dispatch:
  push:
    branches: ["helper/**"]

jobs:
  helper:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the Windows helper
        run: npm run build:win-helper
      - name: Windows mechanisms, with the helper
        run: npm run test:windows
