name: Island paint check

# Looks for stale paint in the island's see-through window on Windows (test/paint-island.mjs). Never publishes anything.
on:
  workflow_dispatch:
  push:
    branches: ["paint/**"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node island/build.mjs --preview
      - name: Smoothing on, hardware acceleration on
        run: npx electron test/paint-island.mjs --mode=smooth --report
      - name: Smoothing on, quick back-and-forth
        run: npx electron test/paint-island.mjs --mode=smooth --script=rally --report
      - name: Smoothing off (what Windows has now)
        run: npx electron test/paint-island.mjs --mode=plain --report
      - name: Smoothing on, hardware acceleration off
        run: npx electron test/paint-island.mjs --mode=smooth --nogpu --report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: island-paint
          path: app/test/out-paint/*.png
          if-no-files-found: ignore
