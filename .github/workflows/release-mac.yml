name: Release Mac

on:
  workflow_dispatch:
  # Once a day: rebuilds only if the dashboard's staging or this repo's main moved since the last build.
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/macos/**"
      - "brand/**"
      - "scripts/**"
      - ".github/workflows/release-mac.yml"

permissions:
  contents: write

# One build at a time.
concurrency:
  group: release-mac
  cancel-in-progress: false

env:
  GETVOCIFY_REF: staging
  VOCIFY_API_URL: https://getvocify-staging.up.railway.app/api/v1

jobs:
  # The daily run builds only if the dashboard or this repo changed since the last build.
  # Every other trigger (push, tag, manual) always builds.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ github.event_name != 'schedule' || steps.seen.outputs.cache-hit != 'true' }}
    steps:
      - id: dashboard
        if: github.event_name == 'schedule'
        run: |
          sha="$(git ls-remote "https://github.com/ToDa-Inc/getvocify.git" "refs/heads/$GETVOCIFY_REF" | cut -f1)"
          if [[ -z "$sha" ]]; then
            echo "Could not read $GETVOCIFY_REF from ToDa-Inc/getvocify." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # A finished build leaves a marker under this key (last step of mac-dmg).
      - id: seen
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .built
          key: built-${{ steps.dashboard.outputs.sha }}-${{ github.sha }}
          lookup-only: true

  mac-dmg:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ToDa-Inc/getvocify
          ref: ${{ env.GETVOCIFY_REF }}
          path: getvocify

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: getvocify/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: getvocify

      - run: swift run VocifyCoreChecks
        working-directory: apps/macos

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/import-apple-cert.sh

      - name: Build and package DMG
        working-directory: apps/macos
        env:
          GETVOCIFY_ROOT: ${{ github.workspace }}/getvocify
          GETVOCIFY_REF: ${{ env.GETVOCIFY_REF }}
          VOCIFY_API_URL: ${{ env.VOCIFY_API_URL }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZE: "0"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/package-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocify-macos
          path: dist/Vocify-macos.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Vocify-macos.dmg
          generate_release_notes: true

      - name: Note which dashboard and desktop commits this build used
        id: built
        run: |
          mkdir -p .built
          echo "dashboard=$(git -C getvocify rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SHA" > .built/desktop
      - name: Remember this build
        uses: actions/cache/save@v4
        with:
          path: .built
          key: built-${{ steps.built.outputs.dashboard }}-${{ github.sha }}
